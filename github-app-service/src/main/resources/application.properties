# Server configuration
server.port=8081

# GitHub App Configuration (set via environment variables)
# These configurations are now sourced from environment variables at runtime.
# Ensure the following environment variables are set in your deployment environment:
#
# GITHUB_APP_ID: Your GitHub App's numerical ID.
#   Example: GITHUB_APP_ID=12345
#
# GITHUB_APP_PRIVATE_KEY: The full content of your GitHub App's private key PEM file.
#   It should be provided as a string, with newline characters handled appropriately
#   (e.g., as literal newlines if the environment supports multi-line variables,
#   or as '\n' characters if it's a single line, which the application will convert).
#   Example (if newlines are escaped):
#   GITHUB_APP_PRIVATE_KEY="-----BEGIN RSA PRIVATE KEY-----\nYOUR_KEY_LINE_1\nYOUR_KEY_LINE_2\n-----END RSA PRIVATE KEY-----"
#   Example (if environment supports multi-line, how you set it depends on the OS/platform):
#   GITHUB_APP_PRIVATE_KEY='''-----BEGIN RSA PRIVATE KEY-----
#   YOUR_KEY_LINE_1
#   YOUR_KEY_LINE_2
#   -----END RSA PRIVATE KEY-----'''
#
# GITHUB_INSTALLATION_ID: The numerical ID of the installation of your GitHub App.
#   This is specific to the organization or user account where the app is installed.
#   Example: GITHUB_INSTALLATION_ID=67890
#
# GITHUB_TARGET_REPOSITORY: The target repository for creating issues, in "owner/repository-name" format.
#   Example: GITHUB_TARGET_REPOSITORY=my-username/my-test-repo
#

# Logging properties (optional, Spring Boot provides sensible defaults)
logging.level.com.example.githubapp=INFO
logging.level.org.kohsuke.github=INFO # Optional: more detailed logging from github-api
